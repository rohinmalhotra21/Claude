# One-click API + database deploy, so a built APK has something to talk to.
# On Render: New → Blueprint → point at this repo.
services:
  - type: web
    name: trainwithrohin-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    # Seeding is guarded by SEED_IF_EMPTY, so restarts do not wipe logged data.
    startCommand: npm run migrate:prod && npm run seed:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trainwithrohin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: NODE_VERSION
        value: '20'
      # Load the demo trainer, two clients and eight weeks of history on a
      # first boot only. Set to false once real clients are using it.
      - key: SEED_IF_EMPTY
        value: 'true'

databases:
  - name: trainwithrohin-db
    plan: free
